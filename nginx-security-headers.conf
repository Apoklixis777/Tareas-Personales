# ==============================================================================
# TaskFlow - Nginx Security Headers (Defense-in-Depth)
# Recomendado por el informe de pentest OWASP / Strix
# ==============================================================================
# Incluir dentro del bloque `server { ... }` o `location / { ... }` en nginx.conf

# Content Security Policy (Restringe orígenes de ejecución y embebido)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' ws: http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

# HTTP Strict Transport Security (HSTS - 1 año con subdominios y preload)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevenir Clickjacking
add_header X-Frame-Options "DENY" always;

# Prevenir MIME-Type Sniffing
add_header X-Content-Type-Options "nosniff" always;

# Política de Referrer para minimizar fugas en enlaces salientes
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restricción de APIs del navegador sensibles no utilizadas
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
